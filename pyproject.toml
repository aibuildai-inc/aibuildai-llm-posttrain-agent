[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aibuildai"
# Single source of truth: the git tag. aibuildai_version.py derives APP_VERSION from
# `git describe` (or installed metadata, or the recorded release version); this dynamic
# directive reads that same value so the package metadata can never drift.
dynamic = ["version"]
description = "Automated machine learning workflow system powered by Claude AI agents."
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# Framework runtime deps only. Heavy ML/data-science packages (torch,
# transformers, scikit-learn, scipy, pandas, numpy, ...) belong to the
# marketplace skill scripts under plugins/**/scripts, which run inside
# the run's own Program environment — NOT the manager process. The manager imports none
# of them, so they must not appear here.
dependencies = [
    "anyio>=4.0,<5",
    "claude-agent-sdk>=0.2.148,<0.3",
    "dbos>=2.29,<2.30",
    # Version 9.6 makes Mapper.to_stored_event abstract, which prevents
    # SearchMapper construction.
    "eventsourcing>=9.5,<9.6",
    "eventsourcing-sqlalchemy==1.0.1",
    "fastapi>=0.138,<1",
    "httpx>=0.28,<1",
    "httpx2>=2.5,<3",
    "jinja2>=3.1,<4",
    "jsonschema>=4.26,<5",
    "mcp>=2.1.1,<3",
    "nvidia-ml-py>=13,<14",
    "orjson>=3.10,<4",
    "pydantic>=2.12.2,<3",
    "PyYAML>=6.0,<7",
    "ruamel.yaml>=0.18,<1",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.38,<1",
]

[project.optional-dependencies]
dev = [
    "pydoc-markdown>=4.8,<5",
    "psutil>=5.9,<8",
    "pyright>=1.1,<2",
    "ruff>=0.15,<0.16",
    # semgrep is intentionally NOT a dev extra: it hard-pins mcp==1.23.3 and
    # click~=8.1, which co-resolving with product deps would downgrade (mcp is
    # a direct claude-agent-sdk dep). The semgrep gate's binary is provisioned
    # isolated instead (own venv or pipx, anything that puts it on PATH).
]

[project.scripts]
aibuildai = "aibuildai_version:run_cli"

[tool.setuptools.dynamic]
# Resolves the `dynamic = ["version"]` directive above. setuptools imports
# aibuildai_version.py and reads the derived APP_VERSION (a string), so the packaged
# metadata version equals the git-tag-derived product version.
version = {attr = "aibuildai_version.APP_VERSION"}

[tool.setuptools]
py-modules = ["aibuildai_version", "bootstrap", "cli", "cli_impl", "config"]

[tool.setuptools.packages.find]
where = ["."]
# Discover every first-party package. Source startup preloads the complete runtime,
# so an editable installation must not depend on a hand-maintained package allowlist.
exclude = [
    "plugins*",
    "configs*",
    "build*",
    "tmp*",
    "scripts*",
    "docs*",
    "submodules*",
    "tasks*",
    "worktrees*",
    "playground*",
]

[tool.setuptools.package-data]
"engine.work_unit.program" = ["resources/aibuildai.py"]
"infra" = ["_catalog_data/model_catalog.json"]
"infra.latex" = ["resources/*"]

[tool.ruff]
target-version = "py312"

# Six of these lint codes are the merged successor of retired codescan rules
# CS09/CS11/CS15/CS16/CS17/CS22 (pure-syntax checks ruff covers natively);
# "F" (pyflakes: undefined names, unused imports/variables) was appended
# 2026-06-10 as a new gate, not a codescan migration.
# Enforced by check.sh over the production scope `output engine infra`
# (backends/ lives under infra/backends/, covered by
# the `infra` entry).
[tool.ruff.lint]
# ANN001/ANN002/ANN003 (missing annotations for args / *args / **kwargs).
# Return-type rules (ANN2xx) are deliberately NOT selected — the return side is
# convention, not yet gated. check.sh runs a second ruff pass with these codes
# over the whole shipped surface, wider than the production scope above.
select = [
    "ANN001", "ANN002", "ANN003",
    "B904", "BLE001", "F", "S101", "S110", "TRY400", "PGH003",
]

[tool.ruff.lint.per-file-ignores]
# CS22 scoped BLE001 (broad-except) to engine/ ONLY; the other prod dirs
# legitimately catch `except Exception`, so ignore BLE001 there.
"output/**" = ["BLE001"]
"engine/work_unit/agent/**" = ["BLE001"]
"infra/**" = ["BLE001"]
"infra/backends/**" = ["BLE001"]
# pyright type gate — integrated 2026-06-10: curated basic mode. NO category is
# disabled: every basic-mode diagnostic must stay at zero errors across the full
# scope below (the last standing-debt category was cleared on 2026-06-11).
# Enforced by check.sh (which passes no paths: this block is the single source
# of truth for scope and severities). The
# trailing history log records what each integration-time category cost to clear.
[tool.pyright]
# Scope: the production dirs plus the auxiliary code dirs. Wider than the ruff
# gate, which still scans only the core production dirs - aligning ruff is a
# separate decision, do not blur it.
include = [
    "output", "engine", "infra",
    "memory", "plugins", "startup",
    "cli.py", "cli_impl.py", "config.py", "bootstrap.py", "aibuildai_version.py", "scripts",
]
# Marketplace skill scripts run inside per-task conda envs; their imports
# (torch, transformers, unsloth, ...) never resolve in the repo env, so
# type-checking them here is a category error, not debt.
# Setting exclude replaces pyright's defaults - restate them.
exclude = [
    "plugins/**/scripts",
    "**/node_modules", "**/__pycache__", "**/.*",
]
# Pinned third-party submodule sources the runtime imports (aibuildai_version.py
# RUNTIME_SUBMODULE_PATHS). They are not installed into the env, so pyright needs
# their trees on its own search path to resolve such an import. TOML cannot read
# the Python list, so this restates it - the same split the py-modules list
# already lives with. Keep the two in step. Empty today.
extraPaths = []
typeCheckingMode = "basic"
# Parameter-annotation enforcement lives in the ruff ANN001-003 gate above, NOT
# here: ruff ANN is syntax-only and needs no import resolution, while pyright's
# reportMissingParameterType would need an executionEnvironments entry to scope
# it, and such an entry reorders pyright's import search path. Do not
# reintroduce reportMissingParameterType or any executionEnvironments entry.
#
# History log — every category that carried integration-time debt, now all
# cleared and enabled (no severity override remains in this block):
# reportIncompatibleVariableOverride / reportOperatorIssue /
# reportIncompatibleMethodOverride: disabled 2026-06-10 with 19/2/1 standing
# errors, re-enabled same day after upstream refactors cleared them to zero.
# reportOptionalMemberAccess / reportReturnType / reportAssignmentType:
# disabled at integration (48/7/1 over the six-dir scope), cleared and
# re-enabled 2026-06-10 (batch B) after fixing 132/10/11 errors
# over the expanded scope.
# reportArgumentType / reportCallIssue: disabled at integration (26/9 over the
# six-dir scope), cleared and re-enabled 2026-06-11 (batch C) after
# fixing ~390 errors over the expanded scope.
# reportAttributeAccessIssue: disabled at integration (320 over the six-dir
# scope), cleared and re-enabled 2026-06-11 (batch D) after fixing
# 692 errors over the expanded scope.
