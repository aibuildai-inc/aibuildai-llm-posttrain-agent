# aibuildai config -- AUTO-GENERATED, do not hand-edit this file.
#
# GENERATED from the Pydantic config models in config.py (the single source of
# truth for defaults AND per-option docs). To change a default/comment or add/
# remove an option, edit config.py and regenerate:
#   `python -m startup.example_yaml`.
#
# To configure a run, copy this file and edit your COPY's values, then:
#   aibuildai run <your copy>
# Lines marked `REQUIRED -- replace` have no default and must be supplied.

# Inputs and the manager-generated identity for one run.
run:
  # short task id (names the output dir)
  # REQUIRED -- replace
  task_name: my-task
  # optional host conda environment cloned into this run's Program environment before Setup; cloning needs conda initialized in the launching shell. A missing base creates a fresh Python 3.11 environment with the product's own tooling, no conda needed; unset means look for an environment named by run.task_name
  conda_env: null
  # the user's task folder: the whole run input. It holds what the task asks for in any readable form plus every material the task needs. Setup reads it, freezes it as the run's README, and writes the run's score program; it is read-only for the whole run
  # REQUIRED -- replace
  data_root: /path/to/task-folder
  # when true, SETUP prepares the task itself: the task statement comes from run.task_prompt and the task folder ships no data, so SETUP follows its llm.system_instructions to obtain the data + evaluation spec, carve a held-out answer key, and author the score program + README from scratch. Default false: the task folder holds the statement and the data, and SETUP only wraps them
  setup_from_scratch: false
  # the task statement for a setup_from_scratch run: what to solve, in the user's own words (e.g. the competition to enter). SETUP copies it verbatim into the run's README, so every later role reads exactly this text. REQUIRED when run.setup_from_scratch is true and REJECTED when it is false -- with setup_from_scratch false the statement lives in the run.data_root task folder instead
  task_prompt: null
  # writable run-output root
  # REQUIRED -- replace
  playground_root: /path/to/playground
  # The run's budget: the whole-pipeline global budget (wall-clock + USD) plus the per-agent governance knobs (cost cap / reminder cadence / finalize threshold). Owned by `run` because a run IS a concern; the budget never forms its own top-level concept.
  budget:
    # minutes before the run stops starting new exploration work (1440 = 24h)
    # work already running and final delivery can continue, so the result can arrive later
    # > 0
    wall_clock_minutes: 1440
    # soft run-level USD admission gate over every exploration agent's own spend; null = no limit
    # > 0
    cost_usd: null
    # USD cap on one agent's own spend; null = no limit
    # > 0
    per_agent_cost_cap_usd: null
# Per-role LLM reasoning profiles: which model each role runs on and how it reasons. ``default`` is the base profile (the router itself runs on it, and every role cascades its unset fields from it); ``by_role`` are per-role overrides; ``auto`` opts into the subagent router. A bare string ``llm: X`` is sugar for ``{default: {model: X}}``.

#     ``profile_for(role)`` resolves a role's complete profile with precedence User(``by_role``) > Router(``auto``) > ``default``, cascading field by field.
llm:
  # A role's COMPLETE reasoning profile: which MODEL it runs on plus the model-coupled reasoning knobs (``effort`` / ``max_thinking_tokens``). You never pick a model without owning its reasoning depth, so both live in one profile. ``llm.default`` is such a profile; ``llm.by_role`` entries are partial :class:`RoleModelProfileOverride` profiles that cascade onto it.
  # the base reasoning profile: model (required) plus reasoning knobs. The router itself runs on this model, and every role cascades its unset fields from here.
  default:
    # model id this role runs on (bare deepseek-* targets DeepSeek; bare gpt-* targets OpenAI; provider/model = OpenRouter; else Anthropic)
    # REQUIRED -- replace
    model: claude-haiku-4-5-20251001
    # reasoning-effort knob. null = unset (no --effort flag, the binary default applies); set low/medium/high/xhigh/max to steer reasoning depth.
    effort: null
    # null lets the model choose thinking depth, guided by effort; 0 disables extended thinking; a positive value sets the budget
    # >= 0
    max_thinking_tokens: null

  # per-role profile overrides, keyed by role ('coder', 'designer', ...). Each entry is a PARTIAL profile (any subset of model/effort/max_thinking_tokens); unset fields cascade from `default` (and the router's model pick). Empty = every role uses `default`. Coexists with `auto` as the highest-precedence layer.
  # Example (uncomment + edit):
  #   by_role:
  #     designer: {model: claude-opus-4-8, effort: high}
  #     coder: {model: claude-sonnet-5}
  #     reviser: {effort: medium}
  by_role: {}

  # opt into the subagent Router with its built-in model-routing skill. Coexists with `by_role`: the router decides each role's MODEL, then a `by_role` override wins field-by-field (User > Router > default).
  # Example (uncomment + edit):
  #   auto:
  #     strategy: llm
  #     mode: stable
  #     per_execution: true
  #     roles: all          # or an exact list such as [designer, coder]
  #     allowed_models:    # null = unrestricted; a list restricts the menu
  #       - claude-haiku-4-5
  #       - claude-sonnet-5
  #       - claude-opus-4-8
  auto: null
  # seconds of provider-outage patience before a paused run stops; unset waits forever
  # > 0
  retry_ceiling_s: null

  # extra run instructions keyed by agent role; each role receives only the text under its own name
  # Example (uncomment + edit):
  #   setup: |
  #     Install every package the task needs.
  #   designer: |
  #     Use a pretrained model when it fits the task.
  #   worker: |
  #     Load the planned pretrained weights.
  system_instructions: {}
